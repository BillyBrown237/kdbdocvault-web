<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020617" />
  <!-- Primary SEO -->
  <title>KDB Doc Vault — Secure Document Management</title>
  <meta name="description"
    content="KDB Doc Vault is a secure document lifecycle management platform for storing, organizing, protecting, sharing, signing, and tracking documents." />
  <meta name="keywords"
    content="KDB Doc Vault, document management, document storage, secure documents, document lifecycle, digital documents, document signing, document workflow, OCR" />
  <meta name="application-name" content="KDB Doc Vault" />
  <!-- Type. Poppins matches the marketing site (headings only), Inter takes the
       interface, JetBrains Mono is the "evidence texture" the reports and
       verification screens set figures in. Weights are pinned to the ones
       actually used — every extra weight is another file on a mobile network.
       `display=swap` so a slow font never blocks first paint.
       NOTE: if a Content-Security-Policy is ever added, it must allow
       fonts.googleapis.com in style-src and fonts.gstatic.com in font-src. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <!-- Icons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KDB Doc Vault — Secure Document Management" />
  <meta property="og:description"
    content="Securely store, organize, share, sign, and manage your documents throughout their entire lifecycle." />
  <meta property="og:site_name" content="KDB Doc Vault" />
  <meta property="og:image" content="/og-image.png" />
  <!-- Twitter / Social Sharing -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KDB Doc Vault — Secure Document Management" />
  <meta name="twitter:description"
    content="A secure document lifecycle management platform for individuals, teams, and organizations." />
  <meta name="twitter:image" content="/og-image.png" />
  <!-- Security / Browser -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="dark light" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
