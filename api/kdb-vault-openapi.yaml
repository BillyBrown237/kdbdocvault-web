openapi: 3.1.0
info:
  title: KDB Vault API
  version: 1.2.0
  summary: Intelligent document lifecycle management platform — REST API v1
  description: 'Every endpoint of the KDB Vault platform: auth, tenants, documents, search & AI,

    lifecycle, workflows, e-signatures, sharing, audit & evidence, notifications,

    reports, administration, imports, and billing.


    Conventions: JWT tenant scoping (tenant id from token, never from parameters),

    cursor pagination, RFC 7807 errors, idempotency keys on non-GET requests,

    ETag/If-Match concurrency, unified 202-job pattern for async work.

    SCIM 2.0 provisioning (Enterprise) is exposed at /scim/v2 per the SCIM standard

    and is not re-documented here.


    Rate limiting: every authenticated response carries X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset
    headers; exceeding the quota returns 429 with Retry-After. Guest/public endpoints (/shared, /sign,
    /verify) have stricter per-IP limits with CAPTCHA escalation.'
  contact:
    name: KDB Vault Engineering
    email: api@kdbvault.com
  x-kdb-convention-notes:
  - key: sort-and-fields
    text: '`sort=` and `fields=` (sparse fieldsets) are documented as global conventions but are implemented
      NOWHERE. Lists have fixed, sensible ordering (recency, or name where that reads better). Post-pilot.'
  - key: job-pattern
    text: The "unified 202-job pattern" is real, but there is no generic GET /jobs/{id}. Each async surface
      owns its own status endpoint — imports at GET /imports/{id}, every export kind (audit export, evidence
      bundle, tenant export) at GET /audit/exports/{jobId}. The 202 response body always carries the polling
      URL, so a client that follows the Location/`job_id` it is GIVEN never needs to know this.
  - key: captcha
    text: Rate-limit headers and 429 + Retry-After are live on every limited response. CAPTCHA escalation
      on public endpoints is NOT implemented; public surfaces rely on strict per-IP limits alone.
  - key: idempotency
    text: 'Idempotency-Key is accepted on non-GET requests but is not yet a replay cache: it is recorded,
      not enforced. Clients must still treat retries as potentially duplicating. Post-pilot.'
servers:
- url: https://api.kdbvault.com/v1
  description: Production
- url: https://api.staging.kdbvault.com/v1
  description: Staging
security:
- bearerAuth: []
tags:
- name: Auth
  description: Registration, login, MFA, sessions, SSO
- name: Profile
  description: Current user, preferences, emergency access
- name: Tenants
  description: Organizations, members, departments, roles
- name: Folders
- name: Documents
  description: Upload, versions, types, tags, links, templates
- name: Search
  description: Hybrid search and AI assistant
- name: Lifecycle
  description: Expiry, reminders, obligations, retention, legal holds
- name: Workflows
  description: Templates, instances, approvals, tasks, comments
- name: Signatures
  description: Envelopes and guest signing
- name: Sharing
  description: Share links, ACLs, data rooms
- name: Audit
  description: Events, evidence bundles, verification
- name: Notifications
- name: Reports
- name: Admin
  description: API keys, webhooks, security policy, export, jobs
- name: Imports
- name: Billing
- name: Health
  description: Unversioned probes (documented here for completeness)
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: authRegister
      summary: Create user account (email or phone + password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 10
                  writeOnly: true
                locale:
                  type: string
                  enum:
                  - fr
                  - en
      responses:
        '201':
          description: Account created, verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify:
    post:
      tags:
      - Auth
      operationId: authVerify
      summary: Verify email/phone with OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              - code
              properties:
                identifier:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Verified
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: authLogin
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              - password
              properties:
                identifier:
                  type: string
                password:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: AuthTokens (no MFA) or MfaChallenge (MFA enabled)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AuthTokens'
                - $ref: '#/components/schemas/MfaChallenge'
              examples:
                tokens:
                  summary: MFA not enabled
                  value:
                    access_token: eyJhbGciOi...
                    expires_in: 900
                    token_type: Bearer
                mfaChallenge:
                  summary: MFA enabled
                  value:
                    mfa_required: true
                    challenge_token: chal_9f2c...
                    methods:
                    - totp
                    - sms
                    expires_in: 300
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 'Returns AuthTokens directly when MFA is not enabled. When MFA is enabled, returns
        an MfaChallenge instead — no tokens are issued until the challenge is completed. Discriminate
        on the presence of mfa_required: true.'
  /auth/mfa/challenge:
    post:
      tags:
      - Auth
      operationId: authMfaChallenge
      summary: Complete MFA challenge (TOTP, SMS, or WebAuthn)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge_token
              properties:
                challenge_token:
                  type: string
                totp_code:
                  type: string
                sms_code:
                  type: string
                webauthn_assertion:
                  type: object
              description: Provide exactly one of totp_code, sms_code, webauthn_assertion.
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: Exchange a challenge_token from /auth/login plus exactly one factor (totp_code, sms_code,
        or webauthn_assertion) for tokens. The challenge is single-use, expires after 5 minutes, and is
        invalidated after 5 failed attempts — the client must then log in again.
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: authRefresh
      summary: Rotate refresh token, mint new access token
      security: []
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: authLogout
      summary: Revoke current session
      responses:
        '204':
          description: Session revoked
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout-all:
    post:
      tags:
      - Auth
      operationId: authLogoutAll
      summary: Revoke all sessions for the user
      responses:
        '204':
          description: All sessions revoked
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/forgot:
    post:
      tags:
      - Auth
      operationId: authPasswordForgot
      summary: Start password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              properties:
                identifier:
                  type: string
      responses:
        '202':
          description: Reset code sent if account exists
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      tags:
      - Auth
      operationId: authPasswordReset
      summary: Complete password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  writeOnly: true
      responses:
        '204':
          description: Password changed
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/switch-tenant:
    post:
      tags:
      - Auth
      operationId: authSwitchTenant
      summary: Mint token scoped to another tenant the user belongs to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant_id
              properties:
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tokens for the selected tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions:
    get:
      tags:
      - Auth
      operationId: authListSessions
      summary: List active sessions/devices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions/{sessionId}:
    delete:
      tags:
      - Auth
      operationId: authRevokeSession
      summary: Revoke a specific session
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Revoked
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/totp/setup:
    post:
      tags:
      - Auth
      operationId: authTotpSetup
      summary: Begin TOTP enrollment
      responses:
        '200':
          description: Secret + otpauth URI for QR
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  otpauth_uri:
                    type: string
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/totp/confirm:
    post:
      tags:
      - Auth
      operationId: authTotpConfirm
      summary: Confirm TOTP with first code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
      responses:
        '204':
          description: TOTP enabled
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/mfa/totp:
    delete:
      tags:
      - Auth
      operationId: authTotpDisable
      summary: Disable TOTP (requires password + current code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              - code
              properties:
                password:
                  type: string
                  writeOnly: true
                code:
                  type: string
      responses:
        '204':
          description: TOTP disabled
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/webauthn/register:
    post:
      tags:
      - Auth
      operationId: authWebauthnRegister
      summary: Register passkey/security key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attestation:
                  type: object
      responses:
        '201':
          description: Credential registered
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: '**NOT YET IMPLEMENTED — answers 501.** Passkeys are not available. Use password +
        authenticator app (TOTP).

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: Passkeys are not available. Use password + authenticator app (TOTP).
  /auth/sso/{provider}/start:
    get:
      tags:
      - Auth
      operationId: authSsoStart
      summary: Begin SSO flow (SAML/OIDC) — Enterprise
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to identity provider
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: *id001
      description: '**NOT YET IMPLEMENTED — answers 501.** Enterprise SSO (SAML/OIDC) is not available.
        Sign in with email + password.

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: Enterprise SSO (SAML/OIDC) is not available. Sign in with email + password.
  /auth/sso/{provider}/callback:
    post:
      tags:
      - Auth
      operationId: authSsoCallback
      summary: SSO assertion callback
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: *id001
      description: '**NOT YET IMPLEMENTED — answers 501.** Enterprise SSO (SAML/OIDC) is not available.

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: Enterprise SSO (SAML/OIDC) is not available.
  /me:
    get:
      tags:
      - Profile
      operationId: getMe
      summary: Current user profile + memberships summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Profile
      operationId: updateMe
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                locale:
                  type: string
                  enum:
                  - fr
                  - en
                phone:
                  type: string
                avatar_upload_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/password:
    patch:
      tags:
      - Profile
      operationId: changePassword
      summary: Change password (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 10
                  writeOnly: true
      responses:
        '204':
          description: Changed
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: '**DIFFERS FROM THIS DESCRIPTION.** PATCH is correct and accepted (B49). PUT is also
        accepted during the transition, because the hand-written SPA client shipped against it.

        <!-- kdb-annotation -->'
      x-kdb-status: changed
      x-kdb-note: PATCH is correct and accepted (B49). PUT is also accepted during the transition, because
        the hand-written SPA client shipped against it.
  /me/notification-preferences:
    get:
      tags:
      - Profile
      operationId: getNotificationPreferences
      summary: Per-channel, per-event preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      tags:
      - Profile
      operationId: setNotificationPreferences
      summary: Update preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: '**DIFFERS FROM THIS DESCRIPTION.** Preferences are per FAMILY (deadlines, approvals,
        signatures, documents, billing), not per raw event type, and cover external channels only — the
        in-app bell is the record of what happened and cannot be switched off. Only `email` delivers today;
        sms, whatsapp and push are accepted but their adapters are log-only.

        <!-- kdb-annotation -->'
      x-kdb-status: changed
      x-kdb-note: Preferences are per FAMILY (deadlines, approvals, signatures, documents, billing), not
        per raw event type, and cover external channels only — the in-app bell is the record of what happened
        and cannot be switched off. Only `email` delivers today; sms, whatsapp and push are accepted but
        their adapters are log-only.
  /me/emergency-contacts:
    get:
      tags:
      - Profile
      operationId: listEmergencyContacts
      summary: List trusted contacts (Personal plans)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmergencyContact'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: *id001
      description: '**NOT YET IMPLEMENTED — answers 501.** Emergency access is a Personal-plan feature;
        the pilot targets businesses. Schema exists (emergency_contacts, V001); no surface yet.

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: Emergency access is a Personal-plan feature; the pilot targets businesses. Schema exists
        (emergency_contacts, V001); no surface yet.
    post:
      tags:
      - Profile
      operationId: addEmergencyContact
      summary: Add trusted contact with access conditions and veto window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - veto_window_hours
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                scope:
                  type: string
                  enum:
                  - all
                  - selected_folders
                folder_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                veto_window_hours:
                  type: integer
                  minimum: 24
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: *id001
      description: '**NOT YET IMPLEMENTED — answers 501.** Emergency access is a Personal-plan feature;
        the pilot targets businesses. Schema exists (emergency_contacts, V001); no surface yet.

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: Emergency access is a Personal-plan feature; the pilot targets businesses. Schema exists
        (emergency_contacts, V001); no surface yet.
  /me/emergency-contacts/{contactId}:
    delete:
      tags:
      - Profile
      operationId: removeEmergencyContact
      summary: Remove trusted contact
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: *id001
      description: '**NOT YET IMPLEMENTED — answers 501.** See GET /me/emergency-contacts.

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: See GET /me/emergency-contacts.
  /emergency-access/{grantToken}/request:
    post:
      tags:
      - Profile
      operationId: requestEmergencyAccess
      summary: (Public) Trusted contact requests access; owner notified, veto timer starts
      security: []
      parameters:
      - name: grantToken
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Request registered, owner notified
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '501':
          description: Not implemented yet (problem+json with code NOT_IMPLEMENTED).
          content: *id001
      description: '**NOT YET IMPLEMENTED — answers 501.** Deferred with the rest of emergency access.
        When built it joins the public-surface contract (capability token, SECURITY DEFINER peephole,
        strict per-IP limit) like /shared, /sign and /verify.

        <!-- kdb-annotation -->'
      x-kdb-status: deferred
      x-kdb-note: Deferred with the rest of emergency access. When built it joins the public-surface contract
        (capability token, SECURITY DEFINER peephole, strict per-IP limit) like /shared, /sign and /verify.
  /tenants:
    post:
      tags:
      - Tenants
      operationId: createTenant
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - plan
              - region
              properties:
                name:
                  type: string
                plan:
                  type: string
                region:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tenant:
    get:
      tags:
      - Tenants
      operationId: getTenant
      summary: Current tenant details, plan, usage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Tenants
      operationId: updateTenant
      summary: Update name, settings, branding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                settings:
                  type: object
                branding:
                  type: object
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
