    MfaChallenge:
      type: object
      description: Returned by /auth/login when the account has MFA enabled. Exchange the challenge_token
        plus exactly one factor at /auth/mfa/challenge.
      required:
      - mfa_required
      - challenge_token
      - methods
      - expires_in
      properties:
        mfa_required:
          type: boolean
          const: true
        challenge_token:
          type: string
          description: Single-use; invalidated after 5 failed attempts
        methods:
          type: array
          items:
            type: string
            enum:
            - totp
            - sms
            - webauthn
          description: Factors enrolled for this account
        expires_in:
          type: integer
          description: Seconds until the challenge expires (default 300)
      examples:
      - mfa_required: true
        challenge_token: chal_9f2c8a...
        methods:
        - totp
        - sms
        expires_in: 300
    LegalHoldReleaseRequest:
      type: object
      description: 'Dual-control release: one admin initiates, a different admin must approve within the
        window.'
      properties:
