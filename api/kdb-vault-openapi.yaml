      in: query
      schema:
        type: string
      description: Sparse fieldset for low-bandwidth clients
    ifMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag concurrency guard
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        format: uuid
    idempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
