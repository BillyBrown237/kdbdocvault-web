# =============================================================================
# FRONTEND deployment: the SPA and the front office.
# Triggered by every push to `develop` in THIS repository.
#
# BRANCH STRATEGY while the product is pre-pilot: `develop` is the only branch
# that deploys, and it deploys to the dev environment. `main` is reserved for
# production and has no workflow yet — deliberately. An unused `main` cannot
# accidentally ship, and adding the production pipeline later is a new file,
# not an edit to a working one.
#
# Independent of the backend pipeline (Kdbdocvault) on purpose. A CSS fix
# should not rebuild .NET images, and a database migration should not wait on
# `npm ci`. The two share a server, not a release cycle.
#
# Division of territory on the VPS:
#   this pipeline  → /var/www/kdbvault-dev/{releases,current}  (static files)
#   backend        → ~/kdbvault-dev                         (compose, containers)
#   neither        → /etc/nginx                             (set up once, by hand)
#
# Nginx should serve the SPA from:
#
#   /var/www/kdbvault-dev/current/web      ← src/, the authenticated app
#
# and the public marketing site from:
#
#   /var/www/kdbvault-dev/current/site     ← marketing/, its own npm project
#
# Two npm projects, two `npm ci`, one release directory. The marketing build
# also prerenders itself to static HTML so the page is readable without
# JavaScript; the bundle step refuses to ship it if that did not happen.
#
# Releases are immutable directories. `current` is a symlink to the active
# release, so publishing a new build is a single symlink replacement rather
# than a delete/copy sequence that can expose a partially deployed tree.
#
# Because the API is proxied same-origin by nginx (/v1 and /pub on the app
# host), the SPA has no API URL to configure and no CORS to negotiate — which
# is also why these two pipelines need no knowledge of each other.
# =============================================================================

name: Deploy web to dev

on:
  push:
    branches: [develop]
    paths-ignore:
      # Docs-only commits shouldn't spend three minutes rebuilding a bundle
      # that comes out byte-identical.
      - "**.md"
      - "docs/**"

  workflow_dispatch:

concurrency:
  group: deploy-web-dev
  cancel-in-progress: true # unlike the backend: a superseded static build is safe to drop

jobs:
  # ===========================================================================
  # BUILD
  # ===========================================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Two independent npm projects in one repository. Without both
          # lockfiles in the cache key, a change to the marketing site's
          # dependencies would silently restore a stale cache.
          cache-dependency-path: |
            package-lock.json
            marketing/package-lock.json

      - run: npm ci

      # Fail here rather than shipping a bundle that compiles but is wrong.
      # `tsc --noEmit` catches what Vite's esbuild transform does not: esbuild
      # strips types without checking them.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Empty on purpose: nginx serves the SPA and proxies /v1 + /pub from
          # the same origin, so an absolute URL would only invite CORS.
          VITE_API_URL: ""
        run: |
          npm run generate-routes
          npm run build

      # -----------------------------------------------------------------------
      # The public marketing site.
      #
      # A separate npm project with its own lockfile, on purpose: a first-time
      # visitor reading a landing page should not download TanStack Router,
      # React Query and pdf.js. It replaces the old hand-written `site/`.
      #
      # Its build also prerenders the page to static HTML — see
      # marketing/scripts/prerender.mjs. That step fails loudly if the render
      # comes back empty, so a silently unindexable deploy cannot get past here.
      # -----------------------------------------------------------------------
      - name: Build marketing site
        working-directory: marketing
        run: |
          npm ci
          npm run build

      - name: Bundle
        run: |
          set -euo pipefail

          test -d dist
          test -d marketing/dist

          # The prerender must actually have happened. An empty root here is
          # a page no crawler can read, and it is invisible in a screenshot.
          # One prerendered document per language. An empty root is a page no
          # crawler can read, and it is invisible in a screenshot.
          # Test for an EMPTY root, not for a particular first child. React
          # hoists resource hints — a `<link rel="preload">` for the eager
          # header logo is emitted ahead of the markup — so asserting that the
          # root opens with a <div> broke the moment the logo became an image.
          for page in index.html fr/index.html; do
            if grep -q 'id="root"></div>' "marketing/dist/$page"; then
              echo "FATAL: marketing/dist/$page has an empty #root."
              echo "The prerender step did not run or produced nothing."
              exit 1
            fi
          done

          # The two must actually differ, or the French build silently shipped
          # English — which typechecks, renders and looks fine in review.
          if ! grep -q '<html lang="fr"' marketing/dist/fr/index.html; then
            echo "FATAL: marketing/dist/fr/index.html is not marked as French."
            exit 1
          fi

          for f in robots.txt sitemap.xml; do
            test -s "marketing/dist/$f" || { echo "FATAL: marketing/dist/$f missing"; exit 1; }
          done

          tar -czf web-bundle.tar.gz -C dist .
          tar -czf site-bundle.tar.gz -C marketing/dist .

          test -s web-bundle.tar.gz
          test -s site-bundle.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundles
          path: |
            web-bundle.tar.gz
            site-bundle.tar.gz
          retention-days: 7

  # ===========================================================================
  # DEPLOY
  # ===========================================================================
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-bundles

      # -----------------------------------------------------------------------
      # Upload bundles to VPS
      # -----------------------------------------------------------------------
      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "web-bundle.tar.gz,site-bundle.tar.gz"
          target: /tmp

      # -----------------------------------------------------------------------
      # Publish release
      # -----------------------------------------------------------------------
      - name: Publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            WEB_ROOT="/var/www/kdbvault-dev"
            RELEASE_ID="${GITHUB_SHA:-$(date +%Y%m%d%H%M%S)}"
            RELEASES_DIR="$WEB_ROOT/releases"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"

            if [ ! -d "$WEB_ROOT" ]; then
              echo "FATAL: $WEB_ROOT does not exist."
              echo "See the backend repo's deploy/README.md."
              exit 1
            fi

            if [ ! -d "$RELEASES_DIR" ]; then
              echo "Creating releases directory: $RELEASES_DIR"
              mkdir -p "$RELEASES_DIR"
            fi

            # Verify that the uploaded artifacts actually exist and are
            # non-empty before touching the active deployment.
            if [ ! -s /tmp/web-bundle.tar.gz ]; then
              echo "FATAL: /tmp/web-bundle.tar.gz is missing or empty."
              exit 1
            fi

            if [ ! -s /tmp/site-bundle.tar.gz ]; then
              echo "FATAL: /tmp/site-bundle.tar.gz is missing or empty."
              exit 1
            fi

            # Never reuse an existing release directory. This makes every
            # deployment immutable and prevents stale files from surviving
            # between builds.
            if [ -e "$RELEASE_DIR" ]; then
              echo "FATAL: release already exists: $RELEASE_DIR"
              exit 1
            fi

            mkdir -p "$RELEASE_DIR/web"
            mkdir -p "$RELEASE_DIR/site"

            # Extract both bundles into the same release directory.
            # Nothing is visible to nginx yet.
            tar -xzf /tmp/web-bundle.tar.gz -C "$RELEASE_DIR/web"
            tar -xzf /tmp/site-bundle.tar.gz -C "$RELEASE_DIR/site"

            # Basic sanity checks before publishing.
            if [ ! -f "$RELEASE_DIR/web/index.html" ]; then
              echo "FATAL: web release has no index.html."
              rm -rf "$RELEASE_DIR"
              exit 1
            fi

            if [ ! -f "$RELEASE_DIR/site/index.html" ]; then
              echo "FATAL: site release has no index.html."
              rm -rf "$RELEASE_DIR"
              exit 1
            fi

            # Capture the currently active release before switching.
            PREVIOUS_RELEASE=""

            if [ -L "$WEB_ROOT/current" ]; then
              PREVIOUS_RELEASE="$(readlink "$WEB_ROOT/current")"
              echo "Previous release: $PREVIOUS_RELEASE"
            elif [ -e "$WEB_ROOT/current" ]; then
              echo "FATAL: $WEB_ROOT/current exists but is not a symlink."
              rm -rf "$RELEASE_DIR"
              exit 1
            else
              echo "No previous release — this is the first deployment."
            fi

            # Publish by replacing the symlink.
            #
            # The release itself is already complete. Nginx continues serving
            # the previous release until this point.
            #
            # `ln -sfn` changes the symlink rather than copying files into the
            # live directory, so nginx never observes a half-extracted build.
            ln -sfn "$RELEASE_DIR" "$WEB_ROOT/current"

            # Verify that the symlink points to the release we just published.
            CURRENT_TARGET="$(readlink "$WEB_ROOT/current")"

            if [ "$CURRENT_TARGET" != "$RELEASE_DIR" ]; then
              echo "FATAL: current symlink does not point to the new release."
              echo "Expected: $RELEASE_DIR"
              echo "Actual:   $CURRENT_TARGET"
              exit 1
            fi

            # Remove uploaded artifacts after successful publication.
            rm -f /tmp/web-bundle.tar.gz
            rm -f /tmp/site-bundle.tar.gz

            echo "--- published ---"
            echo "release: $RELEASE_ID"
            echo "current: $(readlink "$WEB_ROOT/current")"
            echo
            echo "--- web ---"
            ls -la "$WEB_ROOT/current/web" | head -5
            echo
            echo "--- site ---"
            ls -la "$WEB_ROOT/current/site" | head -5

            # Keep the current release plus the previous release.
            #
            # The current release is identified by the current symlink.
            # The immediately previous release is kept as rollback material.
            #
            # Older releases are safe to delete.
            CURRENT_RELEASE="$(readlink -f "$WEB_ROOT/current")"

            find "$RELEASES_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +3 \
              | cut -d' ' -f2- \
              | while IFS= read -r OLD_RELEASE; do
                  if [ -n "$OLD_RELEASE" ] && [ "$OLD_RELEASE" != "$CURRENT_RELEASE" ]; then
                    echo "Removing old release: $OLD_RELEASE"
                    rm -rf "$OLD_RELEASE"
                  fi
                done

  # ===========================================================================
  # SMOKE TEST
  # ===========================================================================
  smoke-test:
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Smoke test
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail

          if [ -z "${APP_HOST:-}" ]; then
            echo "::warning::vars.APP_HOST is not set — skipping the smoke test."
            echo "Add it under Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi

          APP="https://${APP_HOST}"

          echo "checking ${APP}"

          # -------------------------------------------------------------------
          # Diagnostics
          # -------------------------------------------------------------------
          diagnose() {
            echo "--- diagnosis ---" >&2

            if ! getent hosts "$APP_HOST" > /dev/null 2>&1; then
              echo "DNS: ${APP_HOST} does not resolve. Add the A record." >&2
              return
            fi

            echo "DNS: resolves to $(getent hosts "$APP_HOST" | awk '{print $1}' | head -1)" >&2

            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 10 \
              "https://${APP_HOST}/" \
              2>/dev/null || echo "000")

            case "$CODE" in
              000)
                echo "HTTPS: no response. Either nginx isn't running, ports 80/443 are" >&2
                echo "       closed, or certbot hasn't issued a certificate yet." >&2
                echo "       Try: curl -I http://${APP_HOST}/" >&2
                ;;

              403)
                echo "HTTP 403: nginx can't read the frontend release." >&2
                echo "          Check permissions on ${APP_HOST}'s web root." >&2
                ;;

              404)
                echo "HTTP 404: nginx is up but the web root is empty or points elsewhere." >&2
                echo "          Expected: /var/www/kdbvault-dev/current/web" >&2
                ;;

              502|503)
                echo "HTTP ${CODE}: nginx is proxying somewhere that isn't answering." >&2
                echo "          Check: sudo nginx -t; docker compose ps" >&2
                ;;

              *)
                echo "HTTP ${CODE} — unexpected." >&2
                echo "Check: sudo nginx -t; ls -la /var/www/kdbvault-dev/current/web" >&2
                ;;
            esac
          }

          # -------------------------------------------------------------------
          # Test index.html and one generated JavaScript asset.
          #
          # A deployment can technically succeed while serving an index.html
          # that references assets which don't exist. This catches that class
          # of failure.
          # -------------------------------------------------------------------
          for i in $(seq 1 10); do
            HTML=$(curl -fsS --max-time 10 "$APP/" || true)

            if [ -n "$HTML" ]; then

              ASSET=$(
                printf '%s' "$HTML" \
                  | grep -oE '/assets/[^"]+\.js' \
                  | head -1 \
                  || true
              )

              if [ -z "$ASSET" ]; then
                echo "index.html was served but references no /assets/*.js." >&2
                echo "The published build looks wrong, not the infrastructure." >&2
                diagnose
                exit 1
              fi

              # Use GET rather than HEAD. This verifies the same kind of request
              # the browser will actually make for the JavaScript bundle.
              if curl -fsS --max-time 10 "$APP$ASSET" -o /dev/null; then
                echo "OK — index.html and $ASSET both served"
                exit 0
              fi

              echo "index.html served but $ASSET is missing." >&2
              echo "The deployment may be incomplete or nginx may point to the wrong root." >&2
              diagnose
              exit 1
            fi

            if [ "$i" -eq 1 ]; then
              echo "no response yet, retrying..."
            else
              echo "attempt ${i}/10 failed, retrying..."
            fi

            sleep 5
          done

          diagnose
          exit 1

      # -----------------------------------------------------------------------
      # The marketing site, checked for the two things that can be wrong while
      # still returning HTTP 200:
      #
      #   1. the page is served but empty of prerendered markup, so it is
      #      invisible to any crawler that does not run JavaScript;
      #   2. robots.txt or sitemap.xml did not survive the build.
      #
      # Both are silent failures. Neither shows up in a browser.
      # -----------------------------------------------------------------------
      - name: Smoke test the marketing site
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_HOST:-}" ]; then
            echo "::warning::vars.SITE_HOST is not set — skipping the marketing smoke test."
            echo "Add it under Settings → Secrets and variables → Actions → Variables."
            echo "Expected value: site.kdb.dekoubrown.dev"
            exit 0
          fi

          SITE="https://${SITE_HOST}"
          echo "checking ${SITE}"

          HTML=""
          for i in $(seq 1 10); do
            HTML=$(curl -fsS --max-time 10 "$SITE/" || true)
            [ -n "$HTML" ] && break
            echo "attempt ${i}/10 — no response yet, retrying..."
            sleep 5
          done

          if [ -z "$HTML" ]; then
            echo "::error::${SITE} served nothing." >&2
            echo "Check the nginx server block for ${SITE_HOST}; its root should be" >&2
            echo "/var/www/kdbvault-dev/current/site" >&2
            exit 1
          fi

          if ! printf '%s' "$HTML" | grep -q 'Your documents deserve more than a folder'; then
            echo "::error::the page was served but contains no prerendered content." >&2
            echo "A crawler would see an empty <div id=\"root\">." >&2
            echo "Check the prerender step in marketing/scripts/prerender.mjs." >&2
            exit 1
          fi

          # The French page is a separate document at /fr/. If nginx is not
          # resolving the directory it will quietly serve the English index
          # instead, which returns 200 and looks correct until someone reads it.
          FR=$(curl -fsS --max-time 10 "$SITE/fr/" || true)

          if [ -z "$FR" ]; then
            echo "::error::${SITE}/fr/ served nothing." >&2
            echo "nginx needs to resolve the directory — \`try_files \$uri \$uri/ =404\`" >&2
            echo "with \`index index.html\` is enough." >&2
            exit 1
          fi

          if ! printf '%s' "$FR" | grep -q '<html lang="fr"'; then
            echo "::error::${SITE}/fr/ is not the French document." >&2
            echo "It is probably falling back to the English index.html." >&2
            exit 1
          fi

          for f in robots.txt sitemap.xml; do
            if ! curl -fsS --max-time 10 "$SITE/$f" -o /dev/null; then
              echo "::error::${SITE}/${f} is not being served." >&2
              exit 1
            fi
          done

          echo "OK — prerendered HTML, robots.txt and sitemap.xml all served"

  # ===========================================================================
  # ROLLBACK
  #
  # If the smoke test fails, restore the release that was active before this
  # deployment. This is intentionally a separate job so that the deployment
  # failure remains visible in GitHub Actions while the VPS is automatically
  # returned to the last known-good release.
  # ===========================================================================
  rollback:
    needs: [smoke-test]
    if: ${{ always() && needs.smoke-test.result == 'failure' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Roll back frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            WEB_ROOT="/var/www/kdbvault-dev"
            RELEASES_DIR="$WEB_ROOT/releases"
            CURRENT_LINK="$WEB_ROOT/current"

            if [ ! -L "$CURRENT_LINK" ]; then
              echo "FATAL: $CURRENT_LINK is not a symlink."
              echo "Cannot safely determine the active release."
              exit 1
            fi

            CURRENT_RELEASE="$(readlink -f "$CURRENT_LINK")"

            echo "Current release: $CURRENT_RELEASE"

            # Find the most recent release other than the currently active one.
            PREVIOUS_RELEASE=$(
              find "$RELEASES_DIR" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -printf '%T@ %p\n' \
                | sort -nr \
                | cut -d' ' -f2- \
                | while IFS= read -r RELEASE; do
                    if [ "$RELEASE" != "$CURRENT_RELEASE" ]; then
                      echo "$RELEASE"
                      break
                    fi
                  done
            )

            if [ -z "$PREVIOUS_RELEASE" ]; then
              echo "No previous release exists."
              echo "This appears to be the first deployment."
              echo "Nothing to roll back to."
              exit 1
            fi

            if [ ! -d "$PREVIOUS_RELEASE/web" ]; then
              echo "FATAL: previous release is missing its web directory:"
              echo "       $PREVIOUS_RELEASE/web"
              exit 1
            fi

            if [ ! -f "$PREVIOUS_RELEASE/web/index.html" ]; then
              echo "FATAL: previous release has no index.html."
              exit 1
            fi

            echo "Rolling back to:"
            echo "$PREVIOUS_RELEASE"

            ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"

            VERIFY_TARGET="$(readlink -f "$CURRENT_LINK")"

            if [ "$VERIFY_TARGET" != "$PREVIOUS_RELEASE" ]; then
              echo "FATAL: rollback verification failed."
              echo "Expected: $PREVIOUS_RELEASE"
              echo "Actual:   $VERIFY_TARGET"
              exit 1
            fi

            echo "--- rollback complete ---"
            echo "current: $VERIFY_TARGET"