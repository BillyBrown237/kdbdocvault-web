# Build check on every push/PR: typecheck + production build. Deploy stays
# manual (copy dist/ to the VPS deploy/web directory) — a single-VPS pilot
# doesn't need deploy automation yet, but it does need to know the build is
# green before someone copies it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
